<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Quản Trị Key</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { background: #0f172a; color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .admin-card { width: 100%; max-width: 500px; background: rgba(255,255,255,0.07); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.15); border-radius: 20px; padding: 30px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #ffd84d; margin-top: 0; }
        .stats { background: rgba(15, 23, 42, 0.6); padding: 12px; border-radius: 10px; margin-bottom: 20px; text-align: center; font-weight: 600; border: 1px solid rgba(255,255,255,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #cbd5e1; }
        input, textarea { width: 100%; padding: 12px; background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; color: #fff; font-size: 14px; box-sizing: border-box; }
        textarea { height: 100px; resize: vertical; }
        button { width: 100%; padding: 12px; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 15px; margin-top: 5px; transition: 0.2s; }
        .btn-phantom { background: #2563eb; color: #fff; }
        .btn-novax { background: #059669; color: #fff; margin-top: 10px; }
        button:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="admin-card">
        <h2>⚡ Admin Panel</h2>
        
        <div class="stats" id="statsBox">
            Đang tải thống kê kho...
        </div>

        <div class="form-group">
            <label>Mật khẩu Admin:</label>
            <input type="password" id="adminPass" placeholder="Nhập mật khẩu...">
        </div>

        <div class="form-group">
            <label>Danh sách Key (Mỗi key 1 dòng):</label>
            <textarea id="keyInput" placeholder="KEY_ABC_123&#10;KEY_XYZ_789"></textarea>
        </div>

        <button class="btn-phantom" onclick="addKeys('phantom')">➕ Nạp Key Phantom & Aimhack</button>
        <button class="btn-novax" onclick="addKeys('novax')">➕ Nạp Key Novax</button>
    </div>

    <script>
        const BACKEND_URL = "https://tuanq.onrender.com";

        async function loadStats() {
            try {
                const res = await fetch(`${BACKEND_URL}/api/admin/stats`);
                const data = await res.json();
                if (data.success) {
                    document.getElementById('statsBox').innerHTML = 
                        `📦 Kho Phantom: <b style="color:#60a5fa">${data.totalKeys}</b> key | 🛡️ Kho Novax: <b style="color:#34d399">${data.totalNovaxKeys}</b> key`;
                }
            } catch (e) {
                document.getElementById('statsBox').innerText = "Không thể tải thống kê kho.";
            }
        }

        async function addKeys(type) {
            const pass = document.getElementById('adminPass').value;
            const rawText = document.getElementById('keyInput').value;
            const keys = rawText.split('\n').map(k => k.trim()).filter(k => k.length > 0);

            if (!pass) return alert("Vui lòng nhập mật khẩu admin!");
            if (keys.length === 0) return alert("Vui lòng nhập ít nhất 1 key!");

            const endpoint = type === 'novax' ? '/api/admin/add-novax-keys' : '/api/admin/add-keys';

            try {
                const res = await fetch(`${BACKEND_URL}${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pass, keys })
                });
                const data = await res.json();
                alert(data.message);
                if (data.success) {
                    document.getElementById('keyInput').value = '';
                    loadStats();
                }
            } catch (e) {
                alert("Lỗi kết nối tới máy chủ!");
            }
        }

        loadStats();
    </script>
</body>
</html>
