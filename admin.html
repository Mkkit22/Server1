<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Quản Trị Hệ Thống Key</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        body { 
            margin: 0; 
            min-height: 100vh; 
            background: #0b1120; 
            color: #fff; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 20px; 
        }
        .bg { 
            position: fixed; 
            inset: 0; 
            z-index: -1; 
            background: radial-gradient(circle at 15% 15%, rgba(16, 185, 129, 0.25), transparent 45%), 
                        radial-gradient(circle at 85% 85%, rgba(59, 130, 246, 0.25), transparent 45%), 
                        linear-gradient(rgba(10, 18, 32, 0.72), rgba(6, 12, 24, 0.88)), 
                        url("https://i.ibb.co/rRMZMk9h/file-0000000029f48211938a2a560fb9149c.png") center/cover no-repeat; 
        }

        .admin-card { 
            width: 100%; 
            max-width: 480px; 
            background: rgba(255, 255, 255, 0.04); 
            backdrop-filter: blur(25px); 
            -webkit-backdrop-filter: blur(25px); 
            border: 1px solid rgba(255, 255, 255, 0.12); 
            border-radius: 26px; 
            padding: 28px; 
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5); 
        }

        .admin-header {
            text-align: center;
            margin-bottom: 18px;
        }
        .admin-header h2 { 
            margin: 0 0 6px; 
            color: #34d399; 
            font-size: 22px; 
            font-weight: 800; 
        }
        .admin-header p { 
            margin: 0; 
            color: #94a3b8; 
            font-size: 13px; 
        }

        .stats-box { 
            background: rgba(15, 23, 42, 0.65); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            padding: 14px; 
            border-radius: 16px; 
            margin-bottom: 18px; 
            text-align: center; 
            font-size: 13px; 
            font-weight: 600; 
        }
        .stats-box span { color: #38bdf8; font-weight: 800; }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-size: 12px; font-weight: 700; color: #cbd5e1; text-transform: uppercase; letter-spacing: 0.5px; }
        
        input, textarea { 
            width: 100%; 
            padding: 12px 16px; 
            background: rgba(15, 23, 42, 0.75); 
            border: 1px solid rgba(255, 255, 255, 0.15); 
            border-radius: 14px; 
            color: #fff; 
            font-size: 14px; 
            font-family: inherit;
            outline: none;
            transition: 0.2s;
        }
        input:focus, textarea:focus { border-color: #34d399; box-shadow: 0 0 10px rgba(52, 211, 153, 0.2); }
        textarea { height: 90px; resize: vertical; }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        button { 
            width: 100%; 
            padding: 12px; 
            border: none; 
            border-radius: 14px; 
            font-weight: 800; 
            cursor: pointer; 
            font-size: 13px; 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.2s; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        button:hover { transform: translateY(-2px); opacity: 0.92; }

        .btn-phantom { background: linear-gradient(135deg, #3b82f6, #2563eb); color: #fff; }
        .btn-novax { background: linear-gradient(135deg, #10b981, #059669); color: #fff; }
        .btn-zytron { background: linear-gradient(135deg, #8b5cf6, #7c3aed); color: #fff; }
        
        /* Nút xóa màu đỏ */
        .btn-del-phantom { background: rgba(59, 130, 246, 0.2); border: 1px solid #3b82f6; color: #93c5fd; }
        .btn-del-novax { background: rgba(16, 185, 129, 0.2); border: 1px solid #10b981; color: #6ee7b7; }
        .btn-del-zytron { background: rgba(139, 92, 246, 0.2); border: 1px solid #8b5cf6; color: #c4b5fd; }

        .divider {
            border: 0;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
            margin: 20px 0;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: 0.2s;
        }
        .back-home:hover { color: #34d399; }
    </style>
</head>
<body>
    <div class="bg"></div>
    <div class="admin-card">
        <div class="admin-header">
            <h2>⚡ QUẢN TRỊ HỆ THỐNG</h2>
            <p>Nạp và quản lý kho key tự động</p>
        </div>
        
        <div class="stats-box" id="statsBox">
            <i class="fa-solid fa-spinner fa-spin"></i> Đang tải thông tin kho...
        </div>

        <div class="form-group">
            <label><i class="fa-solid fa-lock"></i> Mật Khẩu Admin:</label>
            <input type="password" id="adminPass" placeholder="Nhập mật khẩu quản trị...">
        </div>

        <div class="form-group">
            <label><i class="fa-solid fa-key"></i> Danh Sách Key (Mỗi key 1 dòng):</label>
            <textarea id="keyInput" placeholder="KEY_123_ABC&#10;KEY_456_XYZ"></textarea>
        </div>

        <div class="btn-group">
            <button class="btn-phantom" onclick="addKeys('phantom')">
                <i class="fa-solid fa-ghost"></i> Nạp Key Phantom & Aimhack
            </button>
            <button class="btn-novax" onclick="addKeys('novax')">
                <i class="fa-solid fa-shield-halved"></i> Nạp Key NovaX Client
            </button>
            <button class="btn-zytron" onclick="addKeys('zytron')">
                <i class="fa-solid fa-bolt"></i> Nạp Key Zytron (1 Day)
            </button>
        </div>

        <hr class="divider">

        <div class="form-group">
            <label style="color: #f87171;"><i class="fa-solid fa-trash-arrow-up"></i> Xóa Nhầm Key Gần Nhất:</label>
            <input type="number" id="removeCountInput" placeholder="Nhập số lượng key muốn xóa (vd: 24)..." min="1">
        </div>

        <div class="btn-group">
            <button class="btn-del-phantom" onclick="removeRecentKeys('phantom')">
                <i class="fa-solid fa-trash"></i> Xóa bớt kho Phantom gần nhất
            </button>
            <button class="btn-del-novax" onclick="removeRecentKeys('novax')">
                <i class="fa-solid fa-trash"></i> Xóa bớt kho Novax gần nhất
            </button>
            <button class="btn-del-zytron" onclick="removeRecentKeys('zytron')">
                <i class="fa-solid fa-trash"></i> Xóa bớt kho Zytron gần nhất
            </button>
        </div>

        <a href="https://toiyeumeban.site" class="back-home">
            <i class="fa-solid fa-arrow-left"></i> Quay lại trang chủ Getkey
        </a>
    </div>

    <script>
        const BACKEND_URL = "https://tuanq.onrender.com";

        async function loadStats() {
            try {
                const res = await fetch(`${BACKEND_URL}/api/admin/stats`);
                const data = await res.json();
                if (data.success) {
                    document.getElementById('statsBox').innerHTML = 
                        `📦 Phantom: <span>${data.totalKeys}</span> | 🛡️ Novax: <span>${data.totalNovaxKeys}</span> | ⚡ Zytron: <span>${data.totalZytronKeys || 0}</span>`;
                }
            } catch (e) {
                document.getElementById('statsBox').innerText = "❌ Không thể kết nối tới máy chủ!";
            }
        }

        async function addKeys(type) {
            const pass = document.getElementById('adminPass').value;
            const rawText = document.getElementById('keyInput').value;
            const keys = rawText.split('\n').map(k => k.trim()).filter(k => k.length > 0);

            if (!pass) return alert("Vui lòng nhập mật khẩu admin!");
            if (keys.length === 0) return alert("Vui lòng nhập ít nhất một dòng key!");

            let endpoint = '/api/admin/add-keys';
            if (type === 'novax') endpoint = '/api/admin/add-novax-keys';
            if (type === 'zytron') endpoint = '/api/admin/add-zytron-keys';

            try {
                const res = await fetch(`${BACKEND_URL}${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pass, keys })
                });
                const data = await res.json();
                alert(data.message);
                if (data.success) {
                    document.getElementById('keyInput').value = '';
                    loadStats();
                }
            } catch (e) {
                alert("Lỗi kết nối tới máy chủ!");
            }
        }

        async function removeRecentKeys(type) {
            const pass = document.getElementById('adminPass').value;
            const count = document.getElementById('removeCountInput').value;

            if (!pass) return alert("Vui lòng nhập mật khẩu admin!");
            if (!count || count <= 0) return alert("Vui lòng nhập số lượng key cần xóa chính xác!");

            if (!confirm(`Bạn có chắc chắn muốn xóa ${count} key được nạp gần nhất của kho này không?`)) return;

            try {
                const res = await fetch(`${BACKEND_URL}/api/admin/remove-recent-keys`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pass, count, type })
                });
                const data = await res.json();
                alert(data.message);
                if (data.success) {
                    document.getElementById('removeCountInput').value = '';
                    loadStats();
                }
            } catch (e) {
                alert("Lỗi kết nối tới máy chủ!");
            }
        }

        loadStats();
    </script>
</body>
</html>
