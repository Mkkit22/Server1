<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lấy Key Thành Công - QTuan</title>
<style>
* { box-sizing: border-box; }

:root {
  --blue: #168bff;
  --yellow: #ffd84d;
  --white: #fff;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #07111f;
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

/* Background giống hệt trang đầu */
.bg {
  position: fixed;
  inset: 0;
  z-index: -1;
  background:
    linear-gradient(rgba(3,10,25,.60),
                    rgba(3,10,25,.88)),
    url("https://i.ibb.co/qYn7C0Mn/8945ecd69bcdf96bbf90093ae108d1ad.jpg") center/cover no-repeat;
}

.page {
  max-width: 480px;
  width: 100%;
  display: flex;
  align-items: center;
  flex-direction: column;
  text-align: center;
}

/* Avatar giống hệt trang đầu */
.avatar {
  width: 110px;
  height: 110px;
  object-fit: cover;
  border-radius: 50%;
  border: 4px solid var(--yellow);
  box-shadow: 0 0 24px #168bff99;
  margin-bottom: 20px;
}

.box {
  background: #101c30dd;
  border: 2px solid var(--yellow);
  padding: 25px;
  border-radius: 15px;
  width: 100%;
  box-shadow: 0 0 22px #168bff55;
  backdrop-filter: blur(5px);
}

h2 { color: var(--yellow); margin-top: 0; font-size: 22px; }

input {
  width: 100%;
  padding: 12px;
  font-size: 16px;
  text-align: center;
  background: #0b1729;
  border: 1px solid var(--blue);
  color: var(--yellow);
  border-radius: 8px;
  margin-top: 15px;
  outline: none;
}

button {
  margin-top: 15px;
  padding: 12px 20px;
  background: linear-gradient(120deg, #0878ee, #1554c9);
  color: white;
  border: 2px solid var(--yellow);
  border-radius: 10px;
  font-weight: bold;
  cursor: pointer;
  font-size: 15px;
  transition: .2s;
}

button:active { transform: scale(0.95); }
</style>
</head>
<body>

<div class="bg"></div>

<main class="page">
    <!-- Avatar giống trang đầu -->
    <img class="avatar" src="https://i.ibb.co/h1nNpyr6/a1ecd5a5bc6bbf9b713d399871c91cac.jpg" alt="QTuan avatar">

    <div class="box">
        <h2>XÁC NHẬN HOÀN TẤT</h2>
        <div id="status">⏳ Đang lấy key từ hệ thống...</div>
    </div>
</main>

<script>
const BACKEND_URL = "https://tuanq.onrender.com";

window.addEventListener('DOMContentLoaded', async () => {
    const urlParams = new URLSearchParams(window.location.search);
    const sid = urlParams.get('sid');
    const statusDiv = document.getElementById('status');

    if (!sid) {
        statusDiv.innerHTML = '<b style="color:red">Phiên làm việc không hợp lệ!</b>';
        return;
    }

    try {
        const res = await fetch(`${BACKEND_URL}/api/claim-key?sid=${sid}`);
        const data = await res.json();

        if (data.success) {
            statusDiv.innerHTML = `
                <p style="color:#2ecc71; font-weight:bold;">Lấy key thành công!</p>
                <input type="text" id="keyInput" value="${data.key}" readonly>
                <br>
                <button onclick="copyKey()">📋 SAO CHÉP KEY</button>
            `;
        } else if (data.outOfKey) {
            statusDiv.innerHTML = `<h3 style="color:orange; margin:0;">${data.message}</h3>`;
        } else {
            statusDiv.innerHTML = `<b style="color:red;">${data.message}</b>`;
        }
    } catch (err) {
        statusDiv.innerHTML = '<b style="color:red">Lỗi kết nối máy chủ!</b>';
    }
});

function copyKey() {
    const input = document.getElementById('keyInput');
    input.select();
    input.setSelectionRange(0, 99999);
    navigator.clipboard.writeText(input.value);
    alert('Đã sao chép key thành công!');
}
</script>

</body>
</html>
