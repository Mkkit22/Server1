<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhận Key Phantom</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #fff; text-align: center; padding: 40px 20px; }
        .card { background: #1e293b; max-width: 400px; margin: 0 auto; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .btn { background: #3b82f6; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 15px; }
        .btn:disabled { background: #64748b; cursor: not-allowed; }
        .key-box { background: #0f172a; border: 1px dashed #3b82f6; padding: 12px; margin-top: 15px; border-radius: 6px; font-size: 18px; word-break: break-all; color: #60a5fa; font-weight: bold; }
        .timer { margin-top: 15px; color: #ef4444; font-size: 14px; }
    </style>
</head>
<body>

<div class="card">
    <h2>🎉 VƯỢT LINK THÀNH CÔNG</h2>
    <p>Bấm nút bên dưới để nhận Key của bạn. Key sẽ tự hủy/đóng trang sau 60 giây.</p>
    
    <button id="claimBtn" class="btn" onclick="claimKey()">🔑 BẤM ĐỂ LẤY KEY</button>
    
    <div id="resultArea" style="display: none;">
        <div class="key-box" id="keyText">---</div>
        <button class="btn" style="background:#10b981" onclick="copyKey()">📋 Sao chép Key</button>
        <div class="timer" id="timerText">Trang sẽ tự đóng sau: 60s</div>
    </div>
</div>

<script>
    const BACKEND_URL = "https://tuanq.onrender.com";
    const urlParams = new URLSearchParams(window.location.search);
    const sid = urlParams.get('sid');

    async function claimKey() {
        if (!sid) {
            alert("Phiên làm việc không hợp lệ!");
            return;
        }

        const btn = document.getElementById('claimBtn');
        btn.disabled = true;
        btn.innerText = "⏳ Đang lấy Key...";

        try {
            const res = await fetch(`${BACKEND_URL}/api/claim-key?sid=${sid}`);
            const data = await res.json();

            if (data.success) {
                btn.style.display = 'none';
                document.getElementById('resultArea').style.display = 'block';
                document.getElementById('keyText').innerText = data.key;

                // Bắt đầu đếm ngược 60s tự đóng
                startCountdown(60);
            } else {
                alert(data.message);
                btn.innerText = "❌ Lỗi: " + data.message;
            }
        } catch (e) {
            alert("Lỗi kết nối máy chủ!");
            btn.disabled = false;
            btn.innerText = "🔑 BẤM ĐỂ LẤY KEY";
        }
    }

    function copyKey() {
        const key = document.getElementById('keyText').innerText;
        navigator.clipboard.writeText(key);
        alert("Đã sao chép Key vào khay nhớ tạm!");
    }

    function startCountdown(seconds) {
        let left = seconds;
        const timerElem = document.getElementById('timerText');
        
        const interval = setInterval(() => {
            left--;
            timerElem.innerText = `Trang sẽ tự đóng sau: ${left}s`;
            if (left <= 0) {
                clearInterval(interval);
                window.close(); // Đóng tab
                window.location.href = "about:blank"; // Trang trắng nếu browser chặn auto close
            }
        }, 1000);
    }
</script>

</body>
</html>
