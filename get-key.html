<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhận Key Phantom - QTuan</title>

    <!-- Nhập Google Font Plus Jakarta Sans cho đồng bộ giao diện -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; }

        :root {
            --blue: #168bff;
            --yellow: #ffd84d;
            --white: #fff;
        }

        body { 
            margin: 0;
            min-height: 100vh;
            background: #0f172a; 
            color: #fff; 
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Background sáng sủa, rực rỡ đồng bộ trang chủ */
        .bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            background:
                radial-gradient(circle at 20% 20%, rgba(22, 139, 255, 0.45), transparent 45%),
                radial-gradient(circle at 80% 80%, rgba(255, 216, 77, 0.3), transparent 45%),
                linear-gradient(rgba(10, 25, 50, 0.4), rgba(5, 15, 30, 0.7)),
                url("https://i.ibb.co/qYn7C0Mn/8945ecd69bcdf96bbf90093ae108d1ad.jpg") center/cover no-repeat;
        }

        /* Thẻ Kính lỏng (Liquid Glass) */
        .card { 
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-top: 1px solid rgba(255, 255, 255, 0.4);
            border-left: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 28px;
            padding: 32px 22px; 
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4),
                        inset 0 0 25px rgba(255, 255, 255, 0.08);
            text-align: center;
        }

        .avatar {
            width: 95px;
            height: 95px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid var(--yellow);
            box-shadow: 0 0 20px rgba(22, 139, 255, 0.8), 
                        0 0 8px rgba(255, 216, 77, 0.6);
            margin-bottom: 15px;
        }

        h2 {
            margin: 0 0 10px;
            font-size: 22px;
            font-weight: 800;
            color: var(--yellow);
            text-shadow: 0 0 15px rgba(255, 216, 77, 0.5);
        }

        p {
            color: #cbd5e1;
            font-size: 14px;
            font-weight: 500;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .btn { 
            width: 100%;
            background: linear-gradient(135deg, rgba(14, 140, 255, 0.9), rgba(21, 84, 201, 0.95));
            backdrop-filter: blur(8px);
            color: white; 
            border: 1px solid rgba(255, 216, 77, 0.7); 
            padding: 15px; 
            font-size: 17px; 
            border-radius: 16px; 
            cursor: pointer; 
            font-weight: 800; 
            letter-spacing: 1px;
            box-shadow: 0 8px 25px rgba(22, 139, 255, 0.5),
                        inset 0 1px 3px rgba(255, 255, 255, 0.4);
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(22, 139, 255, 0.7);
        }

        .btn:disabled { 
            background: rgba(100, 116, 139, 0.5); 
            border-color: rgba(255, 255, 255, 0.1);
            cursor: not-allowed; 
            transform: none;
            box-shadow: none;
        }

        .key-box { 
            background: rgba(15, 23, 42, 0.7); 
            border: 1px solid rgba(22, 139, 255, 0.4); 
            padding: 14px; 
            margin-top: 15px; 
            border-radius: 12px; 
            font-size: 17px; 
            word-break: break-all; 
            color: #60a5fa; 
            font-weight: 700;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }

        .timer { 
            margin-top: 15px; 
            color: #f87171; 
            font-size: 13px; 
            font-weight: 700; 
        }
    </style>
</head>
<body>

<div class="bg"></div>

<div class="card">
    <!-- Thêm Avatar của bạn -->
    <img class="avatar" src="https://i.ibb.co/h1nNpyr6/a1ecd5a5bc6bbf9b713d399871c91cac.jpg" alt="QTuan avatar">

    <h2>🎉 VƯỢT LINK THÀNH CÔNG</h2>
    <p>Bấm nút bên dưới để nhận Key của bạn. Key sẽ tự hủy và đóng trang sau 60 giây.</p>
    
    <button id="claimBtn" class="btn" onclick="claimKey()">🔑 BẤM ĐỂ LẤY KEY</button>
    
    <div id="resultArea" style="display: none;">
        <div class="key-box" id="keyText">---</div>
        <button class="btn" style="background: linear-gradient(135deg, #059669, #10b981); margin-top: 15px;" onclick="copyKey()">📋 Sao chép Key</button>
        <div class="timer" id="timerText">Trang sẽ tự đóng sau: 60s</div>
    </div>
</div>

<script>
    const BACKEND_URL = "https://tuanq.onrender.com";
    const urlParams = new URLSearchParams(window.location.search);
    const sid = urlParams.get('sid');

    async function claimKey() {
        if (!sid) {
            alert("Phiên làm việc không hợp lệ!");
            return;
        }

        const btn = document.getElementById('claimBtn');
        btn.disabled = true;
        btn.innerText = "⏳ Đang lấy Key...";

        try {
            const res = await fetch(`${BACKEND_URL}/api/claim-key?sid=${sid}`);
            const data = await res.json();

            if (data.success) {
                btn.style.display = 'none';
                document.getElementById('resultArea').style.display = 'block';
                document.getElementById('keyText').innerText = data.key;

                // Bắt đầu đếm ngược 60s tự đóng
                startCountdown(60);
            } else {
                alert(data.message);
                btn.disabled = false;
                btn.innerText = "❌ Lỗi: " + data.message;
            }
        } catch (e) {
            alert("Lỗi kết nối máy chủ!");
            btn.disabled = false;
            btn.innerText = "🔑 BẤM ĐỂ LẤY KEY";
        }
    }

    function copyKey() {
        const key = document.getElementById('keyText').innerText;
        navigator.clipboard.writeText(key);
        alert("Đã sao chép Key vào khay nhớ tạm!");
    }

    function startCountdown(seconds) {
        let left = seconds;
        const timerElem = document.getElementById('timerText');
        
        const interval = setInterval(() => {
            left--;
            timerElem.innerText = `Trang sẽ tự đóng sau: ${left}s`;
            if (left <= 0) {
                clearInterval(interval);
                window.close(); // Đóng tab
                window.location.href = "about:blank"; // Trang trắng nếu browser chặn auto close
            }
        }, 1000);
    }
</script>

</body>
</html>
