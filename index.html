<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hệ Thống Đang Bảo Trì - QTuan</title>

<!-- Nhập Google Font hiện đại -->
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

:root {
  --blue: #168bff;
  --yellow: #ffd84d;
  --white: #fff;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #0f172a;
  color: white;
  font-family: 'Plus Jakarta Sans', sans-serif;
  overflow-x: hidden;
}

/* Background rực rỡ phong cách Liquid Glass */
.bg {
  position: fixed;
  inset: 0;
  z-index: -1;
  background:
    radial-gradient(circle at 20% 20%, rgba(22, 139, 255, 0.45), transparent 45%),
    radial-gradient(circle at 80% 80%, rgba(255, 216, 77, 0.3), transparent 45%),
    linear-gradient(rgba(10, 25, 50, 0.4), rgba(5, 15, 30, 0.7)),
    url("https://i.ibb.co/qYn7C0Mn/8945ecd69bcdf96bbf90093ae108d1ad.jpg") center/cover no-repeat;
}

.page {
  max-width: 480px;
  min-height: 100vh;
  margin: auto;
  padding: 38px 20px 30px;
  display: flex;
  align-items: center;
  flex-direction: column;
  text-align: center;
  justify-content: center;
}

/* Hiệu ứng Kính lỏng */
.glass-card {
  width: 100%;
  background: rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-top: 1px solid rgba(255, 255, 255, 0.4);
  border-left: 1px solid rgba(255, 255, 255, 0.4);
  border-radius: 28px;
  padding: 32px 20px;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4),
              inset 0 0 25px rgba(255, 255, 255, 0.08);
}

.avatar {
  width: 115px;
  height: 115px;
  object-fit: cover;
  border-radius: 50%;
  border: 3px solid var(--yellow);
  box-shadow: 0 0 25px rgba(22, 139, 255, 0.8), 
              0 0 10px rgba(255, 216, 77, 0.6);
}

h1 {
  margin: 18px 0 6px;
  font-size: 26px;
  font-weight: 800;
  letter-spacing: 0.5px;
  text-shadow: 0 0 20px rgba(22, 139, 255, 0.9);
}

h1 span { color: var(--yellow); }

.author {
  margin: 0;
  color: #e2e8f0;
  font-size: 15px;
  font-weight: 500;
}

.author b { color: var(--yellow); }

.line {
  width: 80px;
  height: 3px;
  margin: 20px auto;
  border-radius: 5px;
  background: linear-gradient(90deg, var(--blue), var(--yellow));
  box-shadow: 0 0 12px var(--blue);
}

/* Thông báo bảo trì */
.maintenance-notice {
  background: rgba(255, 216, 77, 0.1);
  border: 1px solid rgba(255, 216, 77, 0.3);
  border-radius: 16px;
  padding: 16px;
  color: #fef08a;
  font-size: 15px;
  font-weight: 600;
  line-height: 1.5;
  box-shadow: inset 0 0 15px rgba(255, 216, 77, 0.05);
}

/* Khối các liên kết nhóm */
.links {
  width: 100%;
  display: grid;
  gap: 12px;
  margin-top: 24px;
}

.link {
  display: flex;
  align-items: center;
  gap: 15px;
  padding: 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.05);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-top: 1px solid rgba(255, 255, 255, 0.25);
  color: white;
  text-decoration: none;
  text-align: left;
  transition: all 0.3s ease;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
}

.link:hover {
  background: rgba(22, 139, 255, 0.15);
  border-color: rgba(255, 216, 77, 0.6);
  transform: translateY(-3px);
  box-shadow: 0 8px 25px rgba(22, 139, 255, 0.35);
}

.icon-box {
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.1);
  overflow: hidden;
  flex-shrink: 0;
  border: 1px solid rgba(255, 255, 255, 0.2);
}

.icon-box img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.link strong {
  display: block;
  color: var(--yellow);
  margin-bottom: 3px;
  font-size: 15px;
  font-weight: 700;
}

.link small { color: #cbd5e1; font-size: 12px; font-weight: 500; }

footer {
  margin-top: 25px;
  color: #94a3b8;
  font-size: 12px;
  font-weight: 500;
}
</style>
</head>

<body>
<div class="bg"></div>

<main class="page">
  <div class="glass-card">
    <img class="avatar" src="https://i.ibb.co/h1nNpyr6/a1ecd5a5bc6bbf9b713d399871c91cac.jpg" alt="QTuan avatar">

    <h1>HỆ THỐNG <span>BẢO TRÌ</span></h1>
    <p class="author">By <b>QTuan</b></p>

    <div class="line"></div>

    <div class="maintenance-notice">
      ⚠️ Hệ thống đang bảo trì, vui lòng tham gia nhóm để nhận thông báo mới nhất!
    </div>

    <div class="links">
      <a class="link" href="https://zalo.me/g/bttzjw2jwt7vxiyunpx6" target="_blank">
        <span class="icon-box"><img src="https://i.ibb.co/4nMTcjFg/1793250914410.png" alt="Zalo"></span>
        <span>
          <strong>NHÓM ZALO</strong>
          <small>Tham gia cộng đồng Zalo</small>
        </span>
      </a>

      <a class="link" href="https://t.me/tuqnwz" target="_blank">
        <span class="icon-box"><img src="https://i.ibb.co/hRq1sFQP/1793251373352.png" alt="Telegram"></span>
        <span>
          <strong>NHÓM TELEGRAM</strong>
          <small>Cập nhật thông tin qua Telegram</small>
        </span>
      </a>
    </div>
  </div>

  <footer>© 2026 FREE KEY PHANTOM · QTuan</footer>
</main>
</body>
</html>
