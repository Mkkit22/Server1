<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free Key Phantom - QTuan</title>

<!-- Nhập Google Font hiện đại, sắc nét phù hợp với Liquid Glass -->
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

:root {
  --blue: #168bff;
  --yellow: #ffd84d;
  --white: #fff;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #0f172a;
  color: white;
  font-family: 'Plus Jakarta Sans', sans-serif;
  overflow-x: hidden;
}

/* Background sáng sủa, rực rỡ hơn */
.bg {
  position: fixed;
  inset: 0;
  z-index: -1;
  background:
    radial-gradient(circle at 20% 20%, rgba(22, 139, 255, 0.45), transparent 45%),
    radial-gradient(circle at 80% 80%, rgba(255, 216, 77, 0.3), transparent 45%),
    linear-gradient(rgba(10, 25, 50, 0.4), rgba(5, 15, 30, 0.7)),
    url("https://i.ibb.co/qYn7C0Mn/8945ecd69bcdf96bbf90093ae108d1ad.jpg") center/cover no-repeat;
}

.page {
  max-width: 480px;
  min-height: 100vh;
  margin: auto;
  padding: 38px 20px 30px;
  display: flex;
  align-items: center;
  flex-direction: column;
  text-align: center;
}

/* Hiệu ứng Kính lỏng sáng sủa hơn */
.glass-card {
  width: 100%;
  background: rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-top: 1px solid rgba(255, 255, 255, 0.4);
  border-left: 1px solid rgba(255, 255, 255, 0.4);
  border-radius: 28px;
  padding: 32px 20px;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4),
              inset 0 0 25px rgba(255, 255, 255, 0.08);
}

.avatar {
  width: 115px;
  height: 115px;
  object-fit: cover;
  border-radius: 50%;
  border: 3px solid var(--yellow);
  box-shadow: 0 0 25px rgba(22, 139, 255, 0.8), 
              0 0 10px rgba(255, 216, 77, 0.6);
}

h1 {
  margin: 18px 0 6px;
  font-size: 28px;
  font-weight: 800;
  letter-spacing: 0.5px;
  text-shadow: 0 0 20px rgba(22, 139, 255, 0.9);
}

h1 span { color: var(--yellow); }

.author {
  margin: 0;
  color: #e2e8f0;
  font-size: 15px;
  font-weight: 500;
}

.author b { color: var(--yellow); }

.line {
  width: 80px;
  height: 3px;
  margin: 20px auto;
  border-radius: 5px;
  background: linear-gradient(90deg, var(--blue), var(--yellow));
  box-shadow: 0 0 12px var(--blue);
}

/* Nút bấm Getkey sáng bóng */
.getkey {
  width: 100%;
  max-width: 290px;
  padding: 16px;
  border: 1px solid rgba(255, 216, 77, 0.7);
  border-radius: 16px;
  background: linear-gradient(135deg, rgba(14, 140, 255, 0.9), rgba(21, 84, 201, 0.95));
  backdrop-filter: blur(8px);
  color: white;
  font-size: 19px;
  font-weight: 800;
  letter-spacing: 1.5px;
  box-shadow: 0 8px 25px rgba(22, 139, 255, 0.5),
              inset 0 1px 3px rgba(255, 255, 255, 0.4);
  cursor: pointer;
  transition: all 0.3s ease;
}

.getkey:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 30px rgba(22, 139, 255, 0.7),
              inset 0 1px 4px rgba(255, 255, 255, 0.6);
}

.getkey:active { transform: scale(.96); }

#result {
  width: 100%;
  margin-top: 14px;
  padding: 12px;
  border-radius: 12px;
  background: rgba(15, 23, 42, 0.7);
  border: 1px solid rgba(255, 255, 255, 0.1);
  color: var(--yellow);
  font-size: 13px;
  font-weight: 500;
  overflow-wrap: anywhere;
}

#server-status {
  margin-top: 10px;
  font-size: 13px;
  color: #4ade80;
  font-weight: 700;
  text-shadow: 0 0 10px rgba(74, 222, 128, 0.5);
}

/* Khối các liên kết */
.links {
  width: 100%;
  display: grid;
  gap: 12px;
  margin-top: 24px;
}

.link {
  display: flex;
  align-items: center;
  gap: 15px;
  padding: 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.05);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-top: 1px solid rgba(255, 255, 255, 0.25);
  color: white;
  text-decoration: none;
  text-align: left;
  transition: all 0.3s ease;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
}

.link:hover {
  background: rgba(22, 139, 255, 0.15);
  border-color: rgba(255, 216, 77, 0.6);
  transform: translateY(-3px);
  box-shadow: 0 8px 25px rgba(22, 139, 255, 0.35);
}

/* Khung chứa Icon app */
.icon-box {
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.1);
  overflow: hidden;
  flex-shrink: 0;
  border: 1px solid rgba(255, 255, 255, 0.2);
}

.icon-box img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.link strong {
  display: block;
  color: var(--yellow);
  margin-bottom: 3px;
  font-size: 15px;
  font-weight: 700;
}

.link small { color: #cbd5e1; font-size: 12px; font-weight: 500; }

footer {
  margin-top: 25px;
  color: #94a3b8;
  font-size: 12px;
  font-weight: 500;
}
</style>
</head>

<body>
<div class="bg"></div>

<main class="page">
  <div class="glass-card">
    <img class="avatar" src="https://i.ibb.co/h1nNpyr6/a1ecd5a5bc6bbf9b713d399871c91cac.jpg" alt="QTuan avatar">

    <h1>FREE KEY <span>PHANTOM</span></h1>
    <p class="author">By <b>QTuan</b></p>

    <div class="line"></div>

    <button class="getkey" id="getKeyBtn" onclick="startGetKey()">
      🔑 GETKEY
    </button>

    <div id="result">Nhấn GETKEY để bắt đầu nhận key miễn phí.</div>
    <div id="server-status">🟢 Hệ thống Getkey đã sẵn sàng hoạt động!</div>

    <div class="links">
      <a class="link" href="https://www.tiktok.com/@riskmmm.10?_r=1&_t=ZS-9AwHNWUarHM" target="_blank">
        <span class="icon-box"><img src="https://i.ibb.co/wZsqkgh8/1793251345194.png" alt="TikTok"></span>
        <span>
          <strong>TIKTOK</strong>
          <small>Theo dõi kênh TikTok</small>
        </span>
      </a>

      <a class="link" href="https://zalo.me/g/bttzjw2jwt7vxiyunpx6" target="_blank">
        <span class="icon-box"><img src="https://i.ibb.co/4nMTcjFg/1793250914410.png" alt="Zalo"></span>
        <span>
          <strong>NHÓM ZALO</strong>
          <small>Tham gia cộng đồng</small>
        </span>
      </a>

      <a class="link" href="https://t.me/tuqnwz" target="_blank">
        <span class="icon-box"><img src="https://i.ibb.co/hRq1sFQP/1793251373352.png" alt="Telegram"></span>
        <span>
          <strong>NHÓM TELEGRAM</strong>
          <small>Cập nhật thông tin key</small>
        </span>
      </a>
    </div>
  </div>

  <footer>© 2026 FREE KEY PHANTOM · QTuan</footer>
</main>

<script>
const BACKEND_URL = "https://tuanq.onrender.com";

async function startGetKey() {
  const resultBox = document.getElementById("result");
  const btn = document.getElementById("getKeyBtn");
  
  resultBox.textContent = "⏳ Đang tạo phiên và chuyển hướng đến trang vượt link...";
  btn.style.opacity = "0.6";
  btn.style.pointerEvents = "none";

  try {
    let res = await fetch(`${BACKEND_URL}/api/start`);
    let data = await res.json();
    
    if (data.success && data.redirectUrl) {
      window.location.href = data.redirectUrl;
    } else {
      alert("Lỗi khởi tạo phiên!");
      btn.style.opacity = "1";
      btn.style.pointerEvents = "auto";
    }
  } catch (err) {
    alert("Không thể kết nối đến máy chủ Backend!");
    btn.style.opacity = "1";
    btn.style.pointerEvents = "auto";
  }
}
</script>
</body>
</html>
