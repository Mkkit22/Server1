<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free Key Phantom - QTuan</title>

<!-- Nhập Google Font hiện đại -->
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

:root {
  --blue: #168bff;
  --yellow: #ffd84d;
  --green: #4ade80;
  --white: #fff;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #0f172a;
  color: white;
  font-family: 'Plus Jakarta Sans', sans-serif;
  overflow-x: hidden;
}

.bg {
  position: fixed;
  inset: 0;
  z-index: -1;
  background:
    radial-gradient(circle at 20% 20%, rgba(22, 139, 255, 0.45), transparent 45%),
    radial-gradient(circle at 80% 80%, rgba(255, 216, 77, 0.3), transparent 45%),
    linear-gradient(rgba(10, 25, 50, 0.4), rgba(5, 15, 30, 0.7)),
    url("https://i.ibb.co/qYn7C0Mn/8945ecd69bcdf96bbf90093ae108d1ad.jpg") center/cover no-repeat;
}

.page {
  max-width: 480px;
  min-height: 100vh;
  margin: auto;
  padding: 38px 20px 30px;
  display: flex;
  align-items: center;
  flex-direction: column;
  text-align: center;
}

.glass-card {
  width: 100%;
  background: rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-top: 1px solid rgba(255, 255, 255, 0.4);
  border-left: 1px solid rgba(255, 255, 255, 0.4);
  border-radius: 28px;
  padding: 32px 20px;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4),
              inset 0 0 25px rgba(255, 255, 255, 0.08);
}

.avatar {
  width: 110px;
  height: 110px;
  object-fit: cover;
  border-radius: 50%;
  border: 3px solid var(--yellow);
  box-shadow: 0 0 25px rgba(22, 139, 255, 0.8), 
              0 0 10px rgba(255, 216, 77, 0.6);
}

h1 {
  margin: 16px 0 6px;
  font-size: 26px;
  font-weight: 800;
  letter-spacing: 0.5px;
  text-shadow: 0 0 20px rgba(22, 139, 255, 0.9);
}

h1 span { color: var(--yellow); }

.author {
  margin: 0;
  color: #e2e8f0;
  font-size: 14px;
  font-weight: 500;
}

.author b { color: var(--yellow); }

.line {
  width: 80px;
  height: 3px;
  margin: 18px auto;
  border-radius: 5px;
  background: linear-gradient(90deg, var(--blue), var(--yellow));
  box-shadow: 0 0 12px var(--blue);
}

.instruction-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--yellow);
  margin-bottom: 12px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

/* Danh sách các nhiệm vụ */
.tasks-container {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.task-btn {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.05);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.15);
  color: white;
  text-decoration: none;
  font-weight: 600;
  font-size: 14px;
  transition: all 0.3s ease;
  cursor: pointer;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
}

.task-btn:hover {
  background: rgba(255, 255, 255, 0.12);
  border-color: rgba(255, 216, 77, 0.5);
}

.task-btn.completed {
  background: rgba(74, 222, 128, 0.15);
  border-color: rgba(74, 222, 128, 0.5);
  color: #4ade80;
}

.task-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.task-icon {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  object-fit: cover;
}

.task-status {
  font-size: 12px;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 20px;
  background: rgba(255, 255, 255, 0.1);
}

.task-btn.completed .task-status {
  background: rgba(74, 222, 128, 0.3);
  color: #4ade80;
}

/* Thanh tiến độ */
.progress-box {
  margin-bottom: 20px;
  text-align: left;
}

.progress-info {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 6px;
  color: #cbd5e1;
}

.progress-bar-bg {
  width: 100%;
  height: 8px;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 4px;
  overflow: hidden;
}

.progress-bar-fill {
  width: 0%;
  height: 100%;
  background: linear-gradient(90deg, var(--blue), var(--yellow));
  border-radius: 4px;
  transition: width 0.4s ease;
}

/* NÚT GETKEY (Khóa / Mở khóa) */
.getkey {
  width: 100%;
  padding: 16px;
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.15);
  color: #94a3b8;
  font-size: 18px;
  font-weight: 800;
  letter-spacing: 1px;
  cursor: not-allowed;
  transition: all 0.3s ease;
  box-shadow: none;
}

.getkey.unlocked {
  background: rgba(74, 222, 128, 0.15);
  border: 1px solid rgba(74, 222, 128, 0.6);
  color: var(--green);
  cursor: pointer;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3),
              inset 0 1px 4px rgba(255, 255, 255, 0.4),
              0 0 20px rgba(74, 222, 128, 0.3);
}

.getkey.unlocked:hover {
  background: rgba(74, 222, 128, 0.25);
  transform: translateY(-2px);
  box-shadow: 0 15px 35px rgba(74, 222, 128, 0.4);
}

#result {
  width: 100%;
  margin-top: 14px;
  padding: 12px;
  border-radius: 12px;
  background: rgba(15, 23, 42, 0.7);
  border: 1px solid rgba(255, 255, 255, 0.1);
  color: var(--yellow);
  font-size: 13px;
  font-weight: 500;
  overflow-wrap: anywhere;
}

#server-status {
  margin-top: 10px;
  font-size: 13px;
  color: #4ade80;
  font-weight: 700;
}

footer {
  margin-top: 25px;
  color: #94a3b8;
  font-size: 12px;
  font-weight: 500;
}
</style>
</head>

<body>
<div class="bg"></div>

<main class="page">
  <div class="glass-card">
    <img class="avatar" src="https://i.ibb.co/h1nNpyr6/a1ecd5a5bc6bbf9b713d399871c91cac.jpg" alt="QTuan avatar">

    <h1>FREE KEY <span>PHANTOM</span></h1>
    <p class="author">By <b>QTuan</b></p>

    <div class="line"></div>

    <div class="instruction-title">Hoàn thành các bước để mở khóa</div>

    <!-- CÁC NHIỆM VỤ BẮT BUỘC -->
    <div class="tasks-container">
      <a class="task-btn" id="task1" href="https://www.tiktok.com/@riskmmm.10?_r=1&_t=ZS-9AwHNWUarHM" target="_blank" onclick="completeTask(1)">
        <div class="task-left">
          <img class="task-icon" src="https://i.ibb.co/wZsqkgh8/1793251345194.png" alt="TikTok">
          <span>Follow TikTok</span>
        </div>
        <span class="task-status" id="status1">Chưa làm</span>
      </a>

      <a class="task-btn" id="task2" href="https://zalo.me/g/bttzjw2jwt7vxiyunpx6" target="_blank" onclick="completeTask(2)">
        <div class="task-left">
          <img class="task-icon" src="https://i.ibb.co/4nMTcjFg/1793250914410.png" alt="Zalo">
          <span>Vào nhóm Zalo</span>
        </div>
        <span class="task-status" id="status2">Chưa làm</span>
      </a>

      <a class="task-btn" id="task3" href="https://t.me/tuqnwz" target="_blank" onclick="completeTask(3)">
        <div class="task-left">
          <img class="task-icon" src="https://i.ibb.co/hRq1sFQP/1793251373352.png" alt="Telegram">
          <span>Vào nhóm Telegram</span>
        </div>
        <span class="task-status" id="status3">Chưa làm</span>
      </a>
    </div>

    <!-- THANH TIẾN ĐỘ -->
    <div class="progress-box">
      <div class="progress-info">
        <span>Tiến độ mở khóa</span>
        <span id="progressText">0/3</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressBar"></div>
      </div>
    </div>

    <!-- NÚT GETKEY -->
    <button class="getkey" id="getKeyBtn" onclick="startGetKey()">
      🔒 Vui lòng hoàn thành nhiệm vụ
    </button>

    <div id="result">Hãy hoàn thành đủ 3 nhiệm vụ ở trên để mở khóa nút GETKEY.</div>
    <div id="server-status">🟢 Hệ thống sẵn sàng</div>
  </div>

  <footer>© 2026 FREE KEY PHANTOM · QTuan</footer>
</main>

<script>
const BACKEND_URL = "https://tuanq.onrender.com";
let completedTasks = { 1: false, 2: false, 3: false };

function completeTask(id) {
  if (!completedTasks[id]) {
    completedTasks[id] = true;
    
    // Cập nhật giao diện nút nhiệm vụ
    const taskEl = document.getElementById(`task${id}`);
    const statusEl = document.getElementById(`status${id}`);
    
    taskEl.classList.add("completed");
    statusEl.textContent = "Đã xong ✓";

    updateProgress();
  }
}

function updateProgress() {
  const count = Object.values(completedTasks).filter(Boolean).length;
  const percent = (count / 3) * 100;
  
  document.getElementById("progressText").textContent = `${count}/3`;
  document.getElementById("progressBar").style.width = `${percent}%`;

  if (count === 3) {
    const btn = document.getElementById("getKeyBtn");
    btn.classList.add("unlocked");
    btn.textContent = "🔑 MỞ KHÓA GETKEY NGAY";
    document.getElementById("result").textContent = "🎉 Bạn đã hoàn thành tất cả nhiệm vụ! Bấm nút để lấy key.";
  }
}

async function startGetKey() {
  const count = Object.values(completedTasks).filter(Boolean).length;
  if (count < 3) {
    alert("Vui lòng hoàn thành đủ 3 nhiệm vụ trước khi lấy key!");
    return;
  }

  const resultBox = document.getElementById("result");
  const btn = document.getElementById("getKeyBtn");
  
  resultBox.textContent = "⏳ Đang tạo phiên và chuyển hướng đến trang vượt link...";
  btn.style.opacity = "0.6";
  btn.style.pointerEvents = "none";

  try {
    let res = await fetch(`${BACKEND_URL}/api/start`);
    let data = await res.json();
    
    if (data.success && data.redirectUrl) {
      window.location.href = data.redirectUrl;
    } else {
      alert(data.message || "Lỗi khởi tạo phiên!");
      btn.style.opacity = "1";
      btn.style.pointerEvents = "auto";
    }
  } catch (err) {
    alert("Không thể kết nối đến máy chủ Backend!");
    btn.style.opacity = "1";
    btn.style.pointerEvents = "auto";
  }
}
</script>
</body>
</html>
